# Pages CMS (https://pagescms.org): vad som går att redigera och hur fälten ser ut.
# Genereras inte automatiskt – ändra för hand om sidornas innehållsfiler får nya fält.
media:
  input: innehall/bilder
  output: /bilder
  categories:
    - image
  rename: safe
content:
  - name: installningar
    label: Kontaktuppgifter
    type: file
    path: innehall/installningar.yml
    format: yaml
    fields:
      - name: epost
        label: E-postadress
        type: string
        required: true
        pattern:
          regex: ^[^@\s]+@[^@\s]+\.[a-z]{2,}$
          message: Skriv en giltig e-postadress.
        description: Används i sidfoten, på Kontakt och i alla e-postknappar.
      - name: sms
        label: Mobilnummer för sms
        type: string
        required: true
        pattern:
          regex: ^0[0-9 -]{8,12}$
          message: Skriv numret som 070-123 45 67.
        description: Skriv som 070-945 66 98.
      - name: orgnr
        label: Organisationsnummer
        type: string
        required: true
      - name: sate
        label: Säte
        type: string
        required: true
      - name: svarstid
        label: Svarstid
        type: string
        description: Visas inte på webbplatsen just nu. Används med {svarstid} i en text.
  - name: sidor
    label: Sidor
    type: group
    items:
      - name: sida_hem
        label: Startsidan
        type: file
        path: innehall/sidor/hem.yml
        format: yaml
        fields:
          - name: meta
            label: Sökmotorer och delning
            type: object
            fields:
              - name: titel
                label: Sidtitel
                type: string
                required: true
                description: Visas i webbläsarens flik och i Google. Högst cirka 60 tecken.
              - name: beskrivning
                label: Beskrivning
                type: text
                required: true
                description: Visas under länken i Google. Cirka 150 tecken.
              - name: delningstitel
                label: Titel vid delning
                type: string
                description: Visas när sidan delas i sociala medier.
          - name: kort
            label: Kort om sidan (lättläst, visas i Enkelt läge)
            type: string
            list: true
            description: Korta meningar på lättläst svenska. En mening per rad.
          - name: s_h1
            label: Enkelt läge – Tolkning som skapar förbindelse
            type: object
            fields:
              - name: rubrik
                label: Huvudrubrik (h1)
                type: string
                required: true
              - name: stycke
                label: Stycke
                type: text
                description: "Fetstil: **ord**. Länk: [text](/sida/). Kontaktuppgifter: {epost}, {sms}, {orgnr}."
