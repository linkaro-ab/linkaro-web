# Pages CMS (https://pagescms.org): vad som går att redigera och hur fälten ser ut.
# Fälten följer sidans ordning. Får en sida nya fält i innehall/sidor/*.yml måste de läggas till här.
media:
  input: innehall/bilder
  output: /bilder
  categories:
    - image
  rename: safe
content:
  - name: installningar
    label: Kontaktuppgifter
    type: file
    path: innehall/installningar.yml
    format: yaml
    fields:
      - name: epost
        label: E-postadress
        type: string
        required: true
        pattern:
          regex: ^[^@\s]+@[^@\s]+\.[a-z]{2,}$
          message: Skriv en giltig e-postadress.
        description: Används i sidfoten, på Kontakt och i alla e-postknappar.
      - name: sms
        label: Mobilnummer för sms
        type: string
        required: true
        pattern:
          regex: ^0[0-9 -]{8,12}$
          message: Skriv numret som 070-123 45 67.
        description: Skriv som 070-945 66 98.
      - name: orgnr
        label: Organisationsnummer
        type: string
        required: true
      - name: sate
        label: Säte
        type: string
        required: true
      - name: svarstid
        label: Svarstid
        type: string
        description: Visas inte på webbplatsen just nu. Används med {svarstid} i en text.
  - name: sidor
    label: Sidor
    type: group
    items:
      - name: sida_hem
        label: Startsidan
        type: file
        path: innehall/sidor/hem.yml
        format: yaml
        fields:
          - name: h_hero
            label: 1. Toppen – Tolkning som skapar förbindelse
            type: object
            fields:
              - name: rubrik
                label: Huvudrubrik (h1)
                type: string
                required: true
              - name: ingress
                label: Ingress
                type: text
                description: "Fetstil: **ord**. Länk: [text](/sida/). Kontaktuppgifter: {epost}, {sms}, {orgnr}."
              - name: punkt
                label: Punkt
                type: text
                description: "Fetstil: **ord**. Länk: [text](/sida/). Kontaktuppgifter: {epost}, {sms}, {orgnr}."
              - name: bild
                label: Porträtt
                type: image
                description: Kvadratisk bild, minst 940 × 940 pixlar. Visas i en cirkel.
                required: true
              - name: bildtext
                label: Bildtext för skärmläsare (alt-text)
                type: string
                description: Beskriv kort vad bilden visar, till exempel vem det är.
                required: true
          - name: h_trust
