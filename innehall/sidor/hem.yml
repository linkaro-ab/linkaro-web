h_hero:
  rubrik: Tolkning som skapar förbindelse
  ingress: Teckenspråks- och dövblindtolkning med personlig kontakt – från förfrågan till uppföljning.
  punkt: Du behöver aldrig ringa
  bild: /bilder/hem-portratt.jpg
  bildtext: Susanne, medgrundare och tolk på Linkaro.
h_trust:
  rubrik: Därför kan ni lita på oss
  del1:
    rubrik: Utbildade och erfarna tolkar
    text: Utbildade / auktoriserade tolkar av Kammarkollegiet, med många års erfarenhet.
  del2:
    rubrik: God tolksed
    text: Vi är opartiska och tolkar allt som sägs och tecknas.
  del3:
    rubrik: Tystnadsplikt
    text: Det som sägs i ett uppdrag stannar där. Alltid.
  del4:
    rubrik: Systematiskt kvalitetsarbete
    text: Vi följer upp varje uppdrag och förbättrar löpande.
h_tj:
  overrubrik: Tjänster
  rubrik: Tolkning för alla som behöver förstå varandra
  ingress: Vi tolkar på plats och på distans. Ni beskriver situationen – vi föreslår rätt tolkning och rätt tolk.
  kort1:
    rubrik: Teckenspråkstolkning
    text: Mellan svenskt teckenspråk och talad svenska, i möten, samtal och undervisning.
  kort2:
    rubrik: Dövblindtolkning
    text: Taktilt teckenspråk, haptiska signaler, syntolkning av omgivningen och ledsagning.
  kort3:
    rubrik: Distanstolkning
    text: Tolkning via säker videolänk – när det är smidigare än att ses på plats.
h_var:
  overrubrik: Här tolkar vi
  rubrik: Där kommunikationen behöver fungera
  ingress: I stora och små sammanhang, på plats och på distans.
  del1:
    rubrik: Vård och omsorg
    text: Läkarbesök, behandling, habilitering och samtal inom omsorgen.
  del2:
    rubrik: Arbetsliv
    text: Arbetsplatsträffar, medarbetarsamtal, introduktion och anställningsintervjuer.
  del3:
    rubrik: Utbildning
    text: Föreläsningar, lektioner, kurser och utvecklingssamtal.
  del4:
    rubrik: Möten och konferenser
    text: Styrelsemöten, seminarier och konferenser – även med flera tolkar.
  del5:
    rubrik: Myndigheter
    text: Möten och samtal med kommuner, regioner och myndigheter.
  del6:
    rubrik: Kultur och evenemang
    text: Föreställningar, visningar, fester och ceremonier.
h_why:
  overrubrik: Varför Linkaro
  rubrik: Nära, noggrant och att lita på
  steg1:
    rubrik: Personlig kontakt
    text: Ni får en kontaktperson som känner till ert uppdrag, från förfrågan till uppföljning.
  steg2:
    rubrik: Rätt tolk för uppdraget
    text: Vi matchar tolk efter situation, ämne, tolkmetod och tolkanvändarens önskemål.
  steg3:
    rubrik: Pålitlighet och uppföljning
    text: Tydlig bekräftelse, förberedda tolkar och uppföljning efteråt. Avvikelser hanterar vi snabbt och öppet.
h_video:
  overrubrik: På svenskt teckenspråk
  rubrik: Välkommen till Linkaro
  ingress: Susanne berättar kort vilka vi är, hur vi arbetar och hur du når oss. Du kan alltid fråga efter oss med namn när du bokar tolk.
  stycke: "[Video: välkomsthälsning på svenskt teckenspråk, cirka 60 sekunder, med svensk text. Filmen publiceras snart.]"
  fraga: Läs filmens text
  stycke2: Hej och välkommen till Linkaro.
  stycke3: "[Hela texten till filmen, samma innehåll som textningen. Fylls i när filmen är inspelad.]"
h_tolk:
  overrubrik: För tolkar
  rubrik: Är du tolk? Väx med oss
  ingress: Vi bygger ett nätverk av kvalificerade teckenspråks- och dövblindtolkar som vill arbeta nära, med tydliga uppdrag och god uppföljning.
  punkt: Uppdrag i Stockholmsregionen och på distans
  punkt2: Kort väg till beslut i ett litet, familjeägt bolag
  punkt3: Tydliga villkor och förberedelsematerial inför varje uppdrag
h_kontakt:
  overrubrik: Kontakt
  rubrik: Hör av dig på det sätt som passar dig
  ingress: Du behöver aldrig ringa.
  underrubrik: Bokningsförfrågan
  underrubrik2: E-post
  underrubrik3: Sms
  underrubrik4: Videosamtal
  rubrik2: Behöver ni tolk?
  stycke: Skicka en bokningsförfrågan, så återkommer vi med bekräftelse.
kort:
  - Linkaro är ett tolkföretag i Stockholm.
  - Vi tolkar på teckenspråk. Vi tolkar också för personer som är dövblinda.
  - Vi kan tolka på plats eller på video.
  - Du kan boka tolk här på sidan.
  - Du kan kontakta oss med e-post, sms eller video. Du behöver inte ringa.
enkelt:
  s_h1:
    rubrik: Tolkning som skapar förbindelse
    stycke: Vi tolkar mellan svenskt teckenspråk och svenska. Vi tolkar på plats och på distans.
  s_video:
    rubrik: Välkommen på teckenspråk
    stycke: Filmen på svenskt teckenspråk kommer snart. Den får svensk text.
    stycke2: "[Gå till filmen och filmens text](#video)"
  s_tj:
    rubrik: Det här gör vi
    punkt: "**Teckenspråkstolkning.** Vi tolkar mellan teckenspråk och svenska."
    punkt2: "**Dövblindtolkning.** Vi tolkar med taktilt teckenspråk. Vi beskriver omgivningen och ledsagar."
    punkt3: "**Distanstolkning.** Vi tolkar på video."
    stycke: "[Läs mer om våra tjänster](/tjanster/)"
  s_var:
    rubrik: Här tolkar vi
    punkt: Vård och omsorg
    punkt2: Arbetsliv
    punkt3: Skola och utbildning
    punkt4: Möten och konferenser
    punkt5: Myndigheter
    punkt6: Kultur och evenemang
  s_lita:
    rubrik: Därför kan du lita på oss
    punkt: Våra tolkar är utbildade.
    punkt2: Vi har tystnadsplikt.
    punkt3: Vi följer reglerna för god tolksed.
    punkt4: Vi följer upp varje uppdrag.
  s_kontakt:
    rubrik: Kontakta oss
    stycke: Du behöver inte ringa.
    punkt: "E-post: {epost}"
    punkt2: "Sms: {sms}"
    punkt3: "Video: [Boka ett videosamtal](/kontakt/#video)"
  s_tolk:
    rubrik: Är du tolk?
    stycke: Vill du arbeta med oss? [Läs mer och anmäl intresse](/bli-tolk/)
