topp:
  overrubrik: Kontakt
  rubrik: Kontakta oss
  ingress: Hör av dig som det passar dig – du behöver aldrig ringa.
  stycke: |-
    **Vill du boka tolk?**\
    Använd vår e-postmall för bokningar, så får vi alla uppgifter direkt.
h_skriv:
  rubrik: Skriv till oss
  stycke: Skicka ett e-postmeddelande till {epost}. Mallen nedan hjälper oss att svara rätt och snabbt – men skriv gärna fritt.
  stycke2: "**Skicka inga känsliga uppgifter.** Skriv inte personnummer eller uppgifter om någons hälsa i e-post."
  underrubrik: E-postmall
  mall: |
    Vad gäller det? Fråga om tolkning, offert eller upphandling, synpunkt eller klagomål, teknik och IT, eller annat:
    Namn:
    Organisation (valfritt):
    Hur vill du att vi svarar? E-post, sms eller videosamtal på teckenspråk:
    Mobil för sms (om du vill ha svar med sms):

    Meddelande:
  stycke3: Har något inte fungerat i ett uppdrag? Skriv ”Synpunkt eller klagomål” i ämnesraden. Vi dokumenterar, åtgärdar och följer upp alla synpunkter.
  block1:
    rubrik: Andra sätt att nå oss
  block2:
    rubrik: E-post
    text: "{epost}"
    text2: För frågor, bokningar och upphandling.
  block3:
    rubrik: Sms
    text: Även för ändringar med kort varsel.
  block4:
    rubrik: Videosamtal
    text: Boka ett kort videomöte – på svenska eller svenskt teckenspråk.
    text2: "[Bokningslänk kommer.] Tills vidare: skriv till [{epostadress}](mailto:{epostadress}?subject=Videosamtal) så föreslår vi en tid."
  block5:
    rubrik: Här finns vi
    text: Vi utgår från Stockholm och tolkar i hela Stockholms län. På distans tolkar vi i hela Sverige.
  rad1:
    rubrik: Bolag
    text: Linkaro AB
  rad2:
    rubrik: Org.nr
  rad3:
    rubrik: Säte
kort:
  - Här kan du kontakta oss.
  - Du behöver inte ringa.
  - Du kan skicka e-post eller sms.
  - Du kan boka ett videosamtal på teckenspråk.
meta:
  titel: Kontakta oss – utan att ringa | Linkaro
  beskrivning: Kontakta Linkaro med e-post, sms eller videosamtal på svenska eller svenskt teckenspråk. Du behöver aldrig ringa.
